        <rect x="0" y="20" width="312" height="6" rx="3" fill="#1a2d47"/>
        <rect x="0" y="20" width="296" height="6" rx="3" fill="#448aff"/>
        <text x="0" y="42" font-family="JetBrains Mono, monospace" font-size="10" fill="#8ba3c7">94.7% MMLU · GPT-6</text>
      </g>
      <g transform="translate(0, 120)">
