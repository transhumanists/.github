    <g transform="translate(0, 24)" font-family="Space Grotesk, sans-serif">
      <g transform="translate(0, 0)">
        <text x="0" y="14" font-size="12" font-weight="600" fill="#e8f0fe">🧬 Biotechnology</text>
        <rect x="0" y="20" width="312" height="6" rx="3" fill="#1a2d47"/>
        <rect x="0" y="20" width="294" height="6" rx="3" fill="#00e676"/>
        <text x="0" y="42" font-family="JetBrains Mono, monospace" font-size="10" fill="#8ba3c7">94.2% · Broad</text>
      </g>
      <g transform="translate(0, 60)">
