        <rect width="320" height="92" rx="10" fill="#0a1424" stroke="#1a2d47"/>
        <text x="14" y="22" font-size="11" font-weight="700" fill="#00d4ff" font-family="JetBrains Mono, monospace">🚀 SPACEFLIGHT</text>
        <text x="14" y="46" font-size="14" font-weight="600" fill="#e8f0fe">Starship payload to LEO</text>
        <text x="14" y="68" font-size="22" font-weight="700" fill="#00d4ff" font-family="JetBrains Mono, monospace">156 t</text>
        <text x="86" y="68" font-size="11" fill="#8ba3c7">SpaceX · 2026-08-23</text>
        <circle cx="306" cy="12" r="3" fill="#ff9100"/>
      </g>
    </g>
