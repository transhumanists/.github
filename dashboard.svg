        <rect x="16" y="50" width="14" height="30"/>
        <rect x="32" y="30" width="14" height="50"/>
        <rect x="48" y="58" width="14" height="22"/>
        <rect x="64" y="68" width="14" height="12"/>
        <rect x="80" y="44" width="14" height="36"/>
        <rect x="96" y="38" width="14" height="42"/>
        <rect x="112" y="42" width="14" height="38"/>
        <rect x="128" y="22" width="14" height="58"/>
        <rect x="144" y="56" width="14" height="24"/>
        <rect x="160" y="68" width="14" height="12"/>
        <rect x="176" y="10" width="14" height="70"/>
        <rect x="192" y="50" width="14" height="30"/>
        <rect x="208" y="60" width="14" height="20"/>
        <rect x="224" y="46" width="14" height="34"/>
        <rect x="240" y="36" width="14" height="44"/>
        <rect x="256" y="48" width="14" height="32"/>
        <rect x="272" y="56" width="14" height="24"/>
        <rect x="288" y="40" width="14" height="40"/>
        <rect x="304" y="30" width="14" height="50"/>
        <rect x="320" y="14" width="14" height="66"/>
        <rect x="336" y="20" width="14" height="60"/>
        <rect x="352" y="48" width="14" height="32"/>
        <rect x="368" y="34" width="14" height="46"/>
        <rect x="384" y="0" width="14" height="80" fill="#ff9100" fill-opacity="0.9"/>
        <rect x="400" y="44" width="14" height="36"/>
        <rect x="416" y="30" width="14" height="50"/>
        <rect x="432" y="42" width="14" height="38"/>
        <rect x="448" y="56" width="14" height="24"/>
        <rect x="464" y="36" width="14" height="44"/>
