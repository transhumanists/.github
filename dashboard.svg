        <rect x="0" y="20" width="312" height="6" rx="3" fill="#1a2d47"/>
        <rect x="0" y="20" width="280" height="6" rx="3" fill="#b388ff"/>
        <text x="0" y="42" font-family="JetBrains Mono, monospace" font-size="10" fill="#8ba3c7">4,158q · IBM</text>
      </g>
      <g transform="translate(0, 180)">
