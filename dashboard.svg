      <circle cx="420" cy="110" r="5" fill="#ffd740"/>
      <circle cx="420" cy="110" r="9" fill="#ffd740" fill-opacity="0.2"/>
      <text x="400" y="130" font-family="JetBrains Mono, monospace" font-size="8" fill="#ffd740">JT-60SA</text>

      <circle cx="280" cy="60" r="5" fill="#448aff"/>
