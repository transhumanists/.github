<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="transhumanists — Human Progress Dashboard">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1424"/>
      <stop offset="1" stop-color="#060b14"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d4ff"/>
      <stop offset="1" stop-color="#b388ff"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#00d4ff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#00d4ff" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <g stroke="#00d4ff" stroke-opacity="0.06">
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="400" x2="1280" y2="400"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="560" x2="1280" y2="560"/>
  </g>

  <!-- HEADER -->
  <g font-family="Space Grotesk, system-ui, sans-serif" fill="#e8f0fe">
    <text x="48" y="56" font-size="32" font-weight="700" fill="url(#titleGrad)">🚀 transhumanists</text>
    <text x="48" y="82" font-size="14" fill="#8ba3c7" font-family="JetBrains Mono, monospace">Human Progress. Quantified. · Last update 2026-08-29 09:00 UTC</text>
  </g>

  <g font-family="JetBrains Mono, monospace" font-size="11" fill="#4d6480" text-anchor="end">
    <text x="1232" y="40">[BIO]</text><circle cx="1248" cy="36" r="3" fill="#00e676"/>
    <text x="1232" y="56">[AI]</text><circle cx="1248" cy="52" r="3" fill="#448aff"/>
    <text x="1232" y="72">[QUANTUM]</text><circle cx="1248" cy="68" r="3" fill="#b388ff"/>
    <text x="1232" y="88">[ENERGY]</text><circle cx="1248" cy="84" r="3" fill="#ffd740"/>
  </g>

  <!-- LEFT: TOP MILESTONES -->
  <g transform="translate(48, 120)">
    <text x="0" y="0" font-family="Space Grotesk, sans-serif" font-size="18" font-weight="700" fill="#e8f0fe">▌ Recent breakthroughs</text>

    <g transform="translate(0, 24)" font-family="Space Grotesk, sans-serif">
      <!-- Card 1 -->
      <g transform="translate(0, 0)">
        <rect width="320" height="92" rx="10" fill="#0a1424" stroke="#1a2d47"/>
        <text x="14" y="22" font-size="11" font-weight="700" fill="#00e676" font-family="JetBrains Mono, monospace">🧬 BIOTECH</text>
        <text x="14" y="46" font-size="14" font-weight="600" fill="#e8f0fe">CRISPR in-vivo editing</text>
        <text x="14" y="68" font-size="22" font-weight="700" fill="#00e676" font-family="JetBrains Mono, monospace">94.2%</text>
        <text x="120" y="68" font-size="11" fill="#8ba3c7">Broad Institute · 2026-08-25</text>
        <circle cx="306" cy="12" r="3" fill="#ff9100"/>
      </g>
      <!-- Card 2 -->
      <g transform="translate(0, 104)">
        <rect width="320" height="92" rx="10" fill="#0a1424" stroke="#1a2d47"/>
        <text x="14" y="22" font-size="11" font-weight="700" fill="#b388ff" font-family="JetBrains Mono, monospace">⚛️ QUANTUM</text>
        <text x="14" y="46" font-size="14" font-weight="600" fill="#e8f0fe">Physical qubits in system</text>
        <text x="14" y="68" font-size="22" font-weight="700" fill="#b388ff" font-family="JetBrains Mono, monospace">4,158</text>
        <text x="100" y="68" font-size="11" fill="#8ba3c7">IBM Condor 2 · 2026-08-22</text>
        <circle cx="306" cy="12" r="3" fill="#ff9100"/>
      </g>
      <!-- Card 3 -->
      <g transform="translate(0, 208)">
        <rect width="320" height="92" rx="10" fill="#0a1424" stroke="#1a2d47"/>
        <text x="14" y="22" font-size="11" font-weight="700" fill="#ffd740" font-family="JetBrains Mono, monospace">⚡ ENERGY</text>
        <text x="14" y="46" font-size="14" font-weight="600" fill="#e8f0fe">Fusion energy gain (Q)</text>
        <text x="14" y="68" font-size="22" font-weight="700" fill="#ffd740" font-family="JetBrains Mono, monospace">17.6</text>
        <text x="78" y="68" font-size="11" fill="#8ba3c7">NIF Livermore · 2026-08-20</text>
        <circle cx="306" cy="12" r="3" fill="#ff9100"/>
      </g>
      <!-- Card 4 -->
